<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>ROKI</title>
	<link rel="icon" href="favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" crossorigin="anonymous">
	<link rel="stylesheet" href="roki.css">
</head>
<body class="login-page">
	<main class="login">
		<h1 class="wordmark">ROKI</h1>
		<form class="lock-card auth-card" id="form" novalidate>
			<p class="lock-title">Log in to ROKI</p>
			<label class="auth-label" for="username">Username</label>
			<input class="auth-input" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
			<label class="auth-label" for="password">Password</label>
			<input class="auth-input" id="password" type="password" autocomplete="current-password" maxlength="128" required>
			<button class="auth-btn" type="submit" id="go">Log in</button>
			<p class="lock-text auth-msg" id="msg" role="status"></p>
			<p class="lock-text auth-alt" id="alt">New here? Open the invite link you were sent to make an account.</p>
		</form>
	</main>
	<script>
		"use strict";
		const $ = (id) => document.getElementById(id);
		const msg = $("msg");
		function say(text, bad) {
			msg.textContent = text;
			msg.classList.toggle("bad", !!bad);
		}
		// /join/<wrong key>, too many wrong links and /signup without the invite link land here
		const q = new URLSearchParams(location.search);
		if (q.get("link") === "bad") say("That invite link doesn't work. Ask whoever sent it for the new one.", true);
		else if (q.get("link") === "wait") say("Too many wrong links. Wait 15 minutes, then try again.", true);
		else if (q.get("need") === "invite") say("To make an account, open the invite link you were sent first.", true);
		if (q.toString()) history.replaceState(null, "", "/login" + location.hash);

		fetch("/account/state", { cache: "no-store" })
			.then((r) => r.json())
			.then((s) => {
				if (s.user) return location.replace("/" + location.hash);
				if (s.invited) {
					const alt = $("alt");
					alt.textContent = "New here? ";
					const a = document.createElement("a");
					a.href = "/signup" + location.hash;
					a.textContent = "Make an account";
					alt.append(a);
				}
			})
			.catch(() => {});

		$("form").addEventListener("submit", async (e) => {
			e.preventDefault();
			const username = $("username").value.trim();
			const password = $("password").value;
			if (!username || !password) return say("Type your username and password.", true);
			$("go").disabled = true;
			say("Logging in…");
			try {
				const r = await fetch("/account/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password }) });
				const data = await r.json().catch(() => ({}));
				if (r.ok) return location.replace("/" + location.hash);
				say(data.error || "Couldn't log in. Try again.", true);
				$("password").select();
			} catch (err) {
				say("Can't reach ROKI right now. Check your connection.", true);
			}
			$("go").disabled = false;
		});
	</script>
</body>
</html>
