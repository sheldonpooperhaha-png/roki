<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>ROKI</title>
	<link rel="icon" href="favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" crossorigin="anonymous">
	<link rel="stylesheet" href="roki.css">
</head>
<body class="login-page">
	<main class="login">
		<h1 class="wordmark">ROKI</h1>
		<div class="lock-card">
			<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
			<p class="lock-title">ROKI is private</p>
			<p class="lock-text" id="lock-text" role="status">Open your invite link to get in.</p>
		</div>
	</main>

	<script>
		"use strict";
		// /join/<wrong key> and too many wrong links land here with ?link=bad or ?link=wait
		const why = new URLSearchParams(location.search).get("link");
		const text = document.getElementById("lock-text");
		if (why === "bad") {
			text.textContent = "That invite link doesn't work. Ask whoever sent it for the new one.";
			text.classList.add("bad");
		} else if (why === "wait") {
			text.textContent = "Too many wrong links. Wait 15 minutes, then open your invite link again.";
			text.classList.add("bad");
		}
		if (why) history.replaceState(null, "", "/login");
	</script>
</body>
</html>
