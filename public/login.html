<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>ROKI</title>
	<link rel="icon" href="favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500&display=swap" crossorigin="anonymous">
	<link rel="stylesheet" href="roki.css">
</head>
<body class="login-page">
	<main class="login">
		<h1 class="wordmark">ROKI</h1>
		<form class="login-form" id="login-form" autocomplete="on">
			<label class="search-box" for="password">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
				<input id="password" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required autofocus>
			</label>
			<button class="login-btn" type="submit" id="login-btn">Unlock</button>
			<p class="error" id="error" role="alert" hidden></p>
		</form>
	</main>

	<script>
		"use strict";
		const form = document.getElementById("login-form");
		const input = document.getElementById("password");
		const btn = document.getElementById("login-btn");
		const error = document.getElementById("error");

		form.addEventListener("submit", async (e) => {
			e.preventDefault();
			error.hidden = true;
			btn.disabled = true;
			btn.textContent = "Checking…";
			try {
				const res = await fetch("/login", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ password: input.value }),
				});
				const data = await res.json().catch(() => ({}));
				if (res.ok && data.ok) {
					location.replace(location.hash === "#cloak" ? "/#cloak" : "/");
					return;
				}
				error.textContent = data.error || "Couldn't log in. Try again.";
			} catch (err) {
				error.textContent = "Couldn't reach ROKI. Check your connection and try again.";
			}
			error.hidden = false;
			btn.disabled = false;
			btn.textContent = "Unlock";
			input.select();
		});
	</script>
</body>
</html>
