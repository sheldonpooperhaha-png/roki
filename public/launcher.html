<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROKI</title>
<style>
	html, body { margin: 0; height: 100%; background: #07070d; color: #ececf3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	main { height: 100%; box-sizing: border-box; display: grid; place-items: center; text-align: center; padding: 0 16px; }
	h1 { margin: 0 0 10px; font-size: 56px; font-weight: 500; letter-spacing: 0.06em; text-shadow: 0 0 28px rgba(168, 155, 255, 0.45); }
	p { margin: 0; color: #8b8b9d; font-size: 15px; }
</style>
</head>
<body>
<main>
	<div>
		<h1>ROKI</h1>
		<p id="msg">Opening…</p>
	</div>
</main>
<script>
	"use strict";
	// ROKI launcher: opening this file takes you to ROKI, which then hides itself in an about:blank tab.
	// To point it at a different ROKI, change the link below (or download a new launcher from ROKI's Settings).
	const ROKI_LINK = "__ROKI_LINK__";

	if (/^https?:\/\/[^\s"']+$/i.test(ROKI_LINK)) {
		location.replace(ROKI_LINK.replace(/\/+$/, "") + "/#cloak");
	} else {
		document.getElementById("msg").textContent = "This launcher doesn't have a ROKI link yet. Download a new one from Settings in ROKI.";
	}
</script>
</body>
</html>
