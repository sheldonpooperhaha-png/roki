<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catcher</title>
<style>
	html, body { margin: 0; height: 100%; background: #07070d; color: #ececf3; font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; }
	.hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums; pointer-events: none; }
	.msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
	.msg h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: 0.04em; text-shadow: 0 0 24px rgba(168,155,255,.5); }
	.msg p { margin: 4px 0; color: #8b8b9d; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span id="score">Score 0</span><span id="lives">♥♥♥</span><span id="best">Best 0</span></div>
<div class="msg" id="msg">
	<div>
		<h1 id="msg-title">Star Catcher</h1>
		<p>Move with the mouse, your finger, or ← →</p>
		<p>Catch the stars. Miss three and it's over.</p>
		<p><strong style="color:#a89bff">Click or press Space to start</strong></p>
	</div>
</div>
<script>
"use strict";
const c = document.getElementById("c"), ctx = c.getContext("2d");
const scoreEl = document.getElementById("score"), livesEl = document.getElementById("lives"), bestEl = document.getElementById("best");
const msg = document.getElementById("msg"), msgTitle = document.getElementById("msg-title");
let W = 0, H = 0;
let best = 0;
try { best = Number(localStorage.getItem("star-catcher:best")) || 0; } catch (e) {}
bestEl.textContent = "Best " + best;

const paddle = { x: 0, w: 110, h: 12, speed: 9 };
let stars = [], score = 0, lives = 3, running = false, spawnTimer = 0, keys = {};

function resize() {
	const dpr = Math.min(devicePixelRatio || 1, 2);
	W = innerWidth; H = innerHeight;
	c.width = W * dpr; c.height = H * dpr;
	ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	if (!paddle.x) paddle.x = W / 2;
}
addEventListener("resize", resize); resize();

function start() {
	stars = []; score = 0; lives = 3; spawnTimer = 0; running = true;
	msg.hidden = true; update();
}
function update() {
	scoreEl.textContent = "Score " + score;
	livesEl.textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
	bestEl.textContent = "Best " + best;
}
function gameOver() {
	running = false;
	if (score > best) { best = score; try { localStorage.setItem("star-catcher:best", String(best)); } catch (e) {} }
	update();
	msgTitle.textContent = "Game over: " + score;
	msg.hidden = false;
}

addEventListener("pointermove", (e) => { paddle.x = e.clientX; });
addEventListener("pointerdown", (e) => { paddle.x = e.clientX; if (!running) start(); });
addEventListener("keydown", (e) => {
	keys[e.key] = true;
	if ((e.key === " " || e.key === "Enter") && !running) { e.preventDefault(); start(); }
});
addEventListener("keyup", (e) => { keys[e.key] = false; });

function step() {
	if (keys.ArrowLeft) paddle.x -= paddle.speed;
	if (keys.ArrowRight) paddle.x += paddle.speed;
	paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

	if (running) {
		spawnTimer -= 1;
		if (spawnTimer <= 0) {
			stars.push({ x: 20 + Math.random() * (W - 40), y: -10, v: 2 + Math.random() * 1.5 + score * 0.04, r: 7 + Math.random() * 4 });
			spawnTimer = Math.max(18, 55 - score);
		}
		const py = H - 40;
		for (const s of stars) {
			s.y += s.v;
			if (!s.done && s.y + s.r >= py && s.y - s.r <= py + paddle.h && Math.abs(s.x - paddle.x) <= paddle.w / 2 + s.r) {
				s.done = true; score++; update();
			} else if (!s.done && s.y - s.r > H) {
				s.done = true; lives--; update();
				if (lives <= 0) { gameOver(); break; }
			}
		}
		stars = stars.filter((s) => !s.done);
	}

	ctx.clearRect(0, 0, W, H);
	for (const s of stars) {
		ctx.save(); ctx.translate(s.x, s.y); ctx.fillStyle = "#ffe58a"; ctx.shadowColor = "#ffe58a"; ctx.shadowBlur = 12;
		ctx.beginPath();
		for (let i = 0; i < 10; i++) {
			const a = (Math.PI / 5) * i - Math.PI / 2, r = i % 2 ? s.r * 0.45 : s.r;
			ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
		}
		ctx.closePath(); ctx.fill(); ctx.restore();
	}
	ctx.fillStyle = "#a89bff"; ctx.shadowColor = "#a89bff"; ctx.shadowBlur = 16;
	ctx.beginPath(); ctx.roundRect(paddle.x - paddle.w / 2, H - 40, paddle.w, paddle.h, 6); ctx.fill();
	ctx.shadowBlur = 0;
	requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
