<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wobble Brawl</title>
<style>
	html, body { margin: 0; height: 100%; background: #0b1030; color: #f3f4ff; font-family: system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
	canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
	.screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 10, 32, 0.62); padding: 16px; box-sizing: border-box; }
	.card { max-width: 560px; width: 100%; text-align: center; }
	.title { margin: 0; font-size: clamp(46px, 9vw, 88px); font-weight: 900; line-height: 0.95; letter-spacing: 0.01em; color: #fff;
		text-shadow: 4px 4px 0 #13a38b, 8px 8px 0 #0d1022; transform: rotate(-3deg); }
	.title span { display: inline-block; color: #ffd23f; text-shadow: 4px 4px 0 #c4501f, 8px 8px 0 #0d1022; }
	.tag { margin: 22px 0 18px; font-size: 18px; color: #c9cdf2; }
	.big { margin: 0 0 6px; font-size: clamp(34px, 6vw, 54px); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #0d1022; }
	.sub { margin: 0 0 18px; font-size: 18px; color: #c9cdf2; }
	.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; text-align: left; margin: 0 auto 22px; max-width: 420px; font-size: 15px; color: #c9cdf2; }
	.controls b { color: #fff; font-weight: 700; white-space: nowrap; }
	button { font: inherit; font-size: 22px; font-weight: 900; color: #0d1022; background: #2de0c0; border: 0; border-radius: 14px; padding: 14px 34px; cursor: pointer;
		box-shadow: 0 5px 0 #13a38b, 0 9px 0 #0d1022; transition: transform 0.06s; }
	button:hover { background: #5cf0d6; }
	button:active { transform: translateY(4px); box-shadow: 0 1px 0 #13a38b, 0 4px 0 #0d1022; }
	button:focus-visible { outline: 3px solid #ffd23f; outline-offset: 4px; }
	.hint { margin-top: 18px; font-size: 14px; color: #8f95c8; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="screen" id="menu">
	<div class="card">
		<h1 class="title">WOBBLE<br><span>BRAWL</span></h1>
		<p class="tag">Knock out every wobbly fighter on the roof. Don't get knocked out.</p>
		<div class="controls">
			<b>A D or ← →</b><span>Move</span>
			<b>W, ↑ or Space</b><span>Jump</span>
			<b>Click or J</b><span>Punch (aims at your mouse)</span>
			<b>Right-click or K</b><span>Kick</span>
			<b>Esc · M</b><span>Pause · Sound on/off</span>
		</div>
		<button type="button" id="play">Fight!</button>
		<p class="hint" id="menu-best"></p>
	</div>
</div>

<div class="screen" id="over" hidden>
	<div class="card">
		<p class="big">Wobbled!</p>
		<p class="sub" id="over-text"></p>
		<button type="button" id="retry">Try again</button>
		<p class="hint">or press Space</p>
	</div>
</div>

<div class="screen" id="paused" hidden>
	<div class="card">
		<p class="big">Paused</p>
		<button type="button" id="resume">Keep fighting</button>
		<p class="hint">or press Esc</p>
	</div>
</div>

<script src="matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
